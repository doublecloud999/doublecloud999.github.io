{{- /* ============================================================
   自定义样式：JavaGuide 风门户（首页卡片 / 二级菜单 / 系列目录）
   颜色全部走 PaperMod 主题变量，自动适配明暗模式
   ============================================================ */ -}}
<style>
  /* ---------- 布局：列表类页面放宽 ---------- */
  body.list .main {
    max-width: calc(var(--nav-width) + var(--gap) * 2);
  }

  /* ---------- 顶部二级菜单 ---------- */
  /* 主题给 .menu 加了 overflow-x:auto：一个轴不是 visible 时另一轴会变成 auto，
     绝对定位的下拉菜单因此被裁切，挤出横向+纵向两条滚动条。这里放开。 */
  #menu {
    overflow: visible;
    flex-wrap: wrap;
    row-gap: 2px;
  }
  #menu > li.menu-has-children {
    position: relative;
  }
  #menu .menu-caret {
    margin-left: 4px;
    vertical-align: middle;
    opacity: .6;
    transition: transform .18s ease;
  }
  #menu > li.menu-has-children:hover > a .menu-caret,
  #menu > li.menu-has-children.open > a .menu-caret {
    transform: rotate(180deg);
  }
  #menu > li.menu-has-children > .submenu {
    display: none;
    position: absolute;
    top: 100%;
    left: -12px;
    z-index: 60;
    min-width: 176px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
  }
  #menu > li.menu-has-children:hover > .submenu,
  #menu > li.menu-has-children:focus-within > .submenu,
  #menu > li.menu-has-children.open > .submenu {
    display: block;
  }
  #menu > li.menu-has-children > .submenu li {
    display: block;
    line-height: 1.45;
  }
  #menu > li.menu-has-children > .submenu li a {
    display: block;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 15px;
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
  }
  #menu > li.menu-has-children > .submenu li a:hover {
    background: var(--tertiary);
  }
  /* 中窄屏：logo 一行、菜单一行，避免 space-between 把 logo 挤到第二行 */
  @media (max-width: 900px) {
    .header-nav {
      flex-direction: column;
      align-items: flex-start;
    }
    .logo,
    #menu {
      width: 100%;
    }
  }
  /* 窄屏：展开的那一项占满整行，下拉变成内联手风琴，不依赖 hover */
  @media (max-width: 767px) {
    #menu {
      align-content: flex-start;
      row-gap: 0;
    }
    #menu > li.menu-has-children.open {
      flex-basis: 100%;
    }
    #menu > li.menu-has-children > .submenu {
      position: static;
      min-width: 0;
      padding: 2px 0 6px;
      border: none;
      border-left: 2px solid var(--border);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    #menu > li.menu-has-children > .submenu li a {
      padding: 5px 10px;
      font-size: 14px;
    }
  }

  /* ---------- 面包屑 ---------- */
  .breadcrumbs .bc-current {
    color: var(--secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 24em;
  }

  /* ---------- 首页 ---------- */
  .jg-hero {
    text-align: center;
    padding: 32px 16px 8px;
  }
  .jg-hero-title {
    font-size: 34px;
    line-height: 1.25;
    margin: 0 0 8px;
  }
  .jg-hero-sub {
    color: var(--secondary);
    font-size: 16px;
    margin: 0 0 22px;
  }
  .jg-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .jg-btn {
    display: inline-block;
    padding: 9px 22px;
    font-size: 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--entry);
    color: var(--primary);
    text-decoration: none;
    transition: all .18s ease;
  }
  .jg-btn:hover {
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .jg-btn-primary {
    background: var(--primary);
    color: var(--theme);
    border-color: var(--primary);
  }
  .jg-hero-count {
    margin: 18px 0 0;
    font-size: 13px;
    color: var(--secondary);
  }

  .jg-section-title {
    margin: 40px 0 18px;
    padding-left: 12px;
    font-size: 21px;
    border-left: 4px solid var(--primary);
  }

  .jg-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--gap);
  }
  .jg-card {
    display: flex;
    flex-direction: column;
    padding: 18px 20px;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .jg-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .14);
  }
  .jg-card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .jg-card-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--tertiary);
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
  }
  .jg-card-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--primary);
  }
  .jg-card-count {
    margin-left: auto;
    font-size: 12px;
    padding: 1px 9px;
    border-radius: 999px;
    background: var(--tertiary);
    color: var(--content);
  }
  .jg-card-desc {
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--secondary);
  }
  .jg-card-list {
    flex: 1;
    margin: 0;
    padding: 10px 0 0;
    list-style: none;
    border-top: 1px dashed var(--border);
  }
  .jg-card-list li {
    margin: 0 0 6px;
    font-size: 14px;
    line-height: 1.5;
  }
  .jg-card-list li a {
    color: var(--content);
    text-decoration: none;
  }
  .jg-card-list li a:hover {
    color: var(--primary);
    text-decoration: underline;
  }

  .jg-card-more {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    color: var(--secondary);
    text-decoration: none;
  }
  .jg-card-more:hover {
    color: var(--primary);
    text-decoration: underline;
  }

  .jg-recent {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px 24px;
  }
  .jg-recent-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 2px;
    border-bottom: 1px dashed var(--border);
    text-decoration: none;
  }
  .jg-recent-title { color: var(--content); font-size: 14px; }
  .jg-recent-date { color: var(--secondary); font-size: 12px; white-space: nowrap; }
  .jg-recent-item:hover .jg-recent-title { color: var(--primary); }

  /* ---------- 文章内：本系列目录 ---------- */
  .series-nav {
    margin: 36px 0 8px;
    padding: 16px 20px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius);
  }
  .series-nav-title {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
  }
  .series-nav ol {
    margin: 0;
    padding-left: 20px;
  }
  .series-nav li {
    margin: 4px 0;
    font-size: 14px;
    line-height: 1.6;
  }
  .series-nav li a { color: var(--content); text-decoration: none; }
  .series-nav li a:hover { text-decoration: underline; }
  .series-nav li.is-current {
    font-weight: 600;
    color: var(--primary);
  }
  .series-nav li.is-current a { color: var(--primary); }

  /* ---------- 学习路线页 ---------- */
  .roadmap-wrap .roadmap-intro {
    color: var(--secondary);
    margin-bottom: 24px;
  }

  /* ---------- 正文标红（Notion 的 <span color="red">） ---------- */
  .post-content span[color="red"],
  .md-content span[color="red"] {
    color: #d32f2f;
  }
  :root[data-theme="dark"] .post-content span[color="red"],
  :root[data-theme="dark"] .md-content span[color="red"] {
    color: #ff6b6b;
  }

  /* ============================================================
     二期：三栏文档布局（左章节树 / 中正文 820 / 右本页目录）
     ============================================================ */
  /* PaperMod 的 <body> 没有 class，body.single 选不中，用 :has 认三栏页 */
  .main:has(> .doc-layout) {
    max-width: 1440px;
  }

  .doc-layout {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 212px;
    gap: 38px;
    align-items: start;
    max-width: 1280px;
    margin: 0 auto;
    padding: 8px 0 64px;
  }

  /* ---------- 左栏 ---------- */
  .doc-sidebar {
    position: sticky;
    top: calc(var(--header-height) + 16px);
    align-self: start;
    max-height: calc(100vh - var(--header-height) - 32px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 10px;
    border-right: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .doc-sidebar::-webkit-scrollbar { width: 5px; }
  .doc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .sb-group + .sb-group { margin-top: 20px; }
  .sb-group-title {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--primary);
    text-decoration: none;
  }
  .sb-chapter { margin: 0 0 4px; }
  .sb-chapter > summary {
    list-style: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 5px;
    color: var(--content);
    display: flex;
    align-items: center;
  }
  .sb-chapter > summary::-webkit-details-marker { display: none; }
  .sb-chapter > summary::before {
    content: "";
    width: 5px;
    height: 5px;
    margin-right: 7px;
    border-right: 1.5px solid var(--secondary);
    border-bottom: 1.5px solid var(--secondary);
    transform: rotate(-45deg);
    transition: transform .15s ease;
    flex: none;
  }
  .sb-chapter[open] > summary::before { transform: rotate(45deg); }
  .sb-chapter > summary a { color: inherit; text-decoration: none; }
  .sb-chapter > summary:hover { background: var(--tertiary); }

  .sb-chapter ul,
  .sb-flat {
    list-style: none;
    margin: 2px 0 8px;
    padding: 0 0 0 12px;
    border-left: 1px solid var(--border);
  }
  .sb-chapter li a,
  .sb-flat li a {
    display: block;
    padding: 4px 9px;
    border-radius: 5px;
    color: var(--secondary);
    text-decoration: none;
  }
  .sb-chapter li a:hover,
  .sb-flat li a:hover {
    color: var(--primary);
    background: var(--tertiary);
  }
  .sb-chapter li a.active,
  .sb-flat li a.active {
    color: var(--primary);
    background: var(--tertiary);
    font-weight: 500;
  }
  .sb-extra a { color: var(--primary); }
  .sb-extra a::before { content: "◈ "; font-size: 11px; opacity: .65; }

  .sb-mask { display: none; }

  /* ---------- 中栏 ---------- */
  .doc-main { min-width: 0; }
  .doc-main .post-single { max-width: 820px; margin: 0; padding-top: 0; }
  .sb-toggle { display: none; }

  /* ---------- 右栏 ---------- */
  .doc-toc {
    position: sticky;
    top: calc(var(--header-height) + 16px);
    align-self: start;
    max-height: calc(100vh - var(--header-height) - 40px);
    overflow-y: auto;
    font-size: 12.5px;
  }
  .toc-title {
    margin: 0 0 8px;
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--secondary);
  }
  .doc-toc nav#TableOfContents ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-left: 1px solid var(--border);
  }
  .doc-toc nav#TableOfContents ul ul { padding-left: 0; }
  .doc-toc nav#TableOfContents li { margin: 0; }
  .doc-toc nav#TableOfContents a {
    display: block;
    margin-left: -1px;
    padding: 4px 0 4px 10px;
    border-left: 2px solid transparent;
    color: var(--secondary);
    text-decoration: none;
    line-height: 1.45;
  }
  .doc-toc nav#TableOfContents ul ul a { padding-left: 20px; font-size: 12px; }
  .doc-toc nav#TableOfContents a:hover { color: var(--primary); }
  .doc-toc nav#TableOfContents a.active {
    color: var(--primary);
    border-left-color: var(--primary);
    font-weight: 500;
  }

  @media (max-width: 1240px) {
    .doc-layout { grid-template-columns: 228px minmax(0, 1fr); gap: 30px; }
    .doc-toc { display: none; }
  }

  @media (max-width: 900px) {
    .doc-layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 4px; }
    .doc-sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 82vw;
      max-width: 320px;
      max-height: none;
      z-index: 90;
      padding: 18px 14px 40px;
      background: var(--theme);
      border-right: 1px solid var(--border);
      transform: translateX(-102%);
      transition: transform .22s ease;
      overflow-y: auto;
    }
    .doc-sidebar.open {
      transform: none;
      box-shadow: 0 0 48px rgba(0, 0, 0, .55);
    }
    .sb-mask.open {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(0, 0, 0, .5);
    }
    .sb-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0 14px;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--entry);
      color: var(--primary);
      cursor: pointer;
    }
    .sb-toggle::before { content: "☰"; font-size: 13px; }
  }
</style>

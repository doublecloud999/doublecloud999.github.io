{{- if (.Param "ShowBreadCrumbs") -}}
{{- $chev := `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>` -}}
<nav class="breadcrumbs" role="navigation" aria-label="面包屑">
    <a href="{{ "" | absLangURL }}">首页</a>
    {{- with index .Params.categories 0 }}
        {{- $term := . }}
        {{- with site.GetPage (printf "/categories/%s" $term) }}
            {{ $chev | safeHTML }}
            <a href="{{ .RelPermalink }}">{{ $term }}</a>
        {{- end }}
    {{- end }}
    {{ $chev | safeHTML }}
    <span class="bc-current">{{ .Title }}</span>
</nav>
{{- end -}}

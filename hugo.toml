baseURL = 'https://doublecloud999.github.io'
languageCode = 'zh-cn'
title = '技术笔记'
theme = 'PaperMod'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 允许正文里的原始 HTML，用于 Notion 标红 <span color="red">
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true

[params]
  author = 'doublecloud999'
  description = '记录技术学习过程 | 后端 · Agent 方向'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false

# ---------------------------------------------------------------
# 首页「知识体系」分区，数组顺序 = 首页卡片顺序
# key 必须与文章 front matter 里的 categories 值完全一致
# ---------------------------------------------------------------
[[params.sections]]
  key = '语法基础'
  name = 'Java 基础'
  desc = '数组声明与初始化、编码与字节数、类加载等容易忽略的基础细节'

[[params.sections]]
  key = '面向对象'
  name = '面向对象'
  desc = '类与对象、继承与 super、多态、抽象类与接口、String、包装类、泛型、反射'

[[params.sections]]
  key = '集合框架'
  name = '集合框架'
  desc = 'Collection / List / Map / 迭代器 / 队列'

[[params.sections]]
  key = 'IO与文件'
  name = 'IO 与文件'
  desc = '字节流与字符流、节点流与过滤流、缓冲流与对象流、序列化'

[[params.sections]]
  key = '并发多线程'
  name = '并发多线程'
  desc = '进程与线程、线程创建方式、生命周期与锁池、JVM 内存结构'

[[params.sections]]
  key = '算法与数据结构'
  name = '算法与数据结构'
  desc = '数组、链表、双指针、滑动窗口、螺旋矩阵、区间和'

[[params.sections]]
  key = 'Agent'
  name = 'AI Agent'
  desc = 'AgentLoop、PEAS、ReAct / Plan and Solve / Reflection、采样参数与幻觉'

[[params.sections]]
  key = 'Java 基础'
  name = 'Java 基础(早期整合笔记)'
  desc = '早期整篇的 Java 综合笔记'

